# ============================================================
# GITLEAKS — Secret scan (P0.6)
# ============================================================
name: Secret Scan

on:
  pull_request:
  push:
    branches: [stg, uat, prd]   # TODO(P4): đổi thành [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
