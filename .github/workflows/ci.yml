# ============================================================
# CI — data-platform-airflow
#
# Trigger: push hoặc PR vào stg / uat / prd
#
# Branch → Image tag:
#   stg  → ghcr.io/paraline-platform/airflow:stg-<sha>
#   uat  → ghcr.io/paraline-platform/airflow:uat-<sha>
#   prd  → ghcr.io/paraline-platform/airflow:prd-<sha>  +  :<semver> tag
#
# Jobs:
#   1. lint-dags   : py_compile + ruff
#   2. build-image : build + push GHCR (chỉ khi push, không phải PR)
# ============================================================
name: CI

on:
  push:
    branches: [stg, uat, prd]
  pull_request:
    branches: [stg, uat, prd]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/paraline-platform/airflow

jobs:
  # ----------------------------------------------------------
  # JOB 1: Lint DAGs — chạy trên mọi branch / PR
  # ----------------------------------------------------------
  lint-dags:
    name: Lint DAGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff apache-airflow==2.10.4 apache-airflow-providers-cncf-kubernetes

      - name: Syntax check
        run: python -m py_compile dags/*.py && echo "✓ Syntax OK"

      - name: Ruff lint
        run: ruff check dags/ --select E,F,W --ignore E501 && echo "✓ Ruff OK"

  # ----------------------------------------------------------
  # JOB 2: Build & Push image
  # Tag format: <branch>-<short-sha>  +  latest-<branch>
  # Ví dụ: stg-a1b2c3d, latest-stg
  #         uat-a1b2c3d, latest-uat
  #         prd-a1b2c3d, latest-prd
  #
  # Image push chỉ xảy ra khi MERGE vào branch (không phải PR)
  # PR chỉ build để verify Dockerfile hợp lệ
  # ----------------------------------------------------------
  build-image:
    name: Build & Push (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: lint-dags
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # <branch>-<short-sha>  (vd: stg-a1b2c3d) — immutable, dùng cho rollback
            type=sha,prefix=${{ github.ref_name }}-,format=short
            # latest-<branch>  (vd: latest-stg) — mutable, dùng cho Argo CD image tracking
            type=raw,value=latest-${{ github.ref_name }},enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name == 'push'
        run: |
          echo "### Image pushed 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
